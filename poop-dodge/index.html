<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>밥덩이의 · 똥피하기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f8fd;color:#213b57;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}main{max-width:500px;margin:auto;padding:22px 18px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.eyebrow{font-size:10px;letter-spacing:3px;color:#648baa;font-weight:800}h1{font-size:27px;letter-spacing:-1.3px;margin:4px 0}button{font:inherit;cursor:pointer;border:0;border-radius:14px;font-weight:750;color:inherit}button:focus-visible{outline:3px solid #fbad53;outline-offset:3px}.small{padding:11px 14px;background:white;border:1px solid #d6e5ee;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.stat{background:white;border:1px solid #deebf4;border-radius:16px;padding:12px 14px}.stat span{display:block;font-size:11px;color:#728ba0;margin-bottom:3px}.stat strong{font-size:23px;font-variant-numeric:tabular-nums}.stat em{font-size:11px;font-style:normal;margin-left:3px;color:#8798a8}.stage{position:relative;overflow:hidden;border-radius:24px;border:1px solid #cee2ef;box-shadow:0 14px 40px #355e8510;background:#ddecfa;aspect-ratio:420/520;max-height:64svh;margin:auto}canvas{display:block;width:100%;height:100%;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#edf7fd66;backdrop-filter:blur(3px);padding:24px}.overlay[hidden]{display:none}.card{text-align:center;width:100%;max-width:310px;padding:28px 22px;background:#fffffff0;border:1px solid white;border-radius:24px;box-shadow:0 12px 32px #37608712}.badge{display:inline-block;color:#4b89b2;background:#eaf6ff;border-radius:99px;font-size:11px;font-weight:750;padding:6px 12px}.hero{height:78px;width:78px;object-fit:contain;margin:14px auto 0;display:block}h2{font-size:27px;letter-spacing:-1px;margin:12px 0 10px}.card p{font-size:13px;line-height:1.8;color:#6d8295;margin:0 0 20px;white-space:pre-line}.primary{width:100%;background:#357fc2;color:white;padding:15px;box-shadow:0 5px 0 #256aa7}.controls{display:flex;gap:12px;margin-top:14px}.move{width:50%;height:55px;background:white;border:1px solid #d6e5ee;box-shadow:0 3px 0 #dbe8f1;touch-action:none;user-select:none;-webkit-user-select:none}.move:active{background:#e1f0fd;transform:translateY(2px)}footer{text-align:center;font-size:11px;color:#8598a9;line-height:1.9;margin-top:16px}.key{padding:2px 6px;border:1px solid #d5e3ed;border-radius:5px;background:white}@media(max-height:740px){main{padding-top:12px}header{margin-bottom:8px}.stat{padding:8px 12px}.stage{max-height:58svh}.card{padding:18px}.hero{height:52px;margin-top:8px}footer{margin-top:10px}}
</style></head><body><main>
<header><div><div class="eyebrow">BAPDEONGI'S POOP DODGE</div><h1 id="title">밥덩이의 똥피하기</h1></div><button class="small" id="pause" disabled>일시정지 Ⅱ</button></header>
<section class="stats" aria-label="게임 기록"><div class="stat"><span>현재 점수</span><strong id="score">0</strong></div><div class="stat"><span>최고 기록</span><strong id="best">0</strong></div><div class="stat"><span>버틴 시간</span><strong id="time">0.0</strong><em>초</em></div></section>
<div class="stage"><canvas id="game" width="420" height="520" aria-label="좌우 방향키 또는 아래 버튼으로 떨어지는 똥을 피하세요"></canvas><div class="overlay" id="overlay"><div class="card"><span class="badge" id="badge">밥덩이를 살려라!</span><img class="hero" src="assets/player.png" alt="기본 캐릭터"><h2 id="headline">똥을 피하자!</h2><p id="message">하늘에서 무언가 떨어진다…\n좌우로 움직여 끝까지 살아남기!</p><button class="primary" id="start">게임 시작 →</button></div></div></div>
<div class="controls"><button class="move" id="left" aria-label="왼쪽으로 이동">◀ 왼쪽</button><button class="move" id="right" aria-label="오른쪽으로 이동">오른쪽 ▶</button></div>
<footer><span class="key">←</span> <span class="key">→</span> 이동 · <span class="key">P</span> 일시정지<br>모바일은 버튼을 꾹 누르거나 게임 화면을 드래그하세요.<br><span id="storageNote">최고 기록은 이 브라우저에 저장돼요.</span></footer>
</main><script src="settings.js"></script><script src="game.js"></script></body></html>
